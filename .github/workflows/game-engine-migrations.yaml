name: Game Site Engine Migrations

on:
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-d1-migrations:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/migration-generation.db
      SITE_KEY: migration-ci
      VITE_APP_URL: http://localhost:3000
      VITE_APP_NAME: Migration CI
      VITE_DEFAULT_LOCALE: en
      AUTH_SECRET: migration-ci-only-secret
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate provider schemas
        run: pnpm db:setup

      - name: Generate incremental migrations from current schema
        run: pnpm db:generate

      - name: Verify migration state
        run: |
          test -f drizzle/meta/_journal.json
          test "$(find drizzle -maxdepth 1 -name '*.sql' | wc -l)" -gt 0
          echo "Current migration files:"
          find drizzle -maxdepth 2 -type f | sort

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-engine-drizzle
          path: drizzle
          if-no-files-found: error
          retention-days: 7

      - name: Commit migration files only when schema changed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -f drizzle
          if git diff --cached --quiet; then
            echo 'Drizzle migrations already match current schema; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(db): sync generated D1 migrations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
