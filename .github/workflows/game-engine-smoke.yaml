name: Game Site Engine Smoke

on:
  pull_request:
    branches: ['main', 'dev']
  push:
    branches: ['main', 'dev']
  workflow_dispatch:

jobs:
  sqlite-domain-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/game-engine-ci.db
      SITE_KEY: local-dev
      DEPLOY_ENV: development
      VITE_APP_URL: http://localhost:3000
      VITE_APP_NAME: Game Engine CI
      VITE_DEFAULT_LOCALE: en
      AUTH_SECRET: game-engine-ci-only-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate provider schemas
        run: pnpm db:setup

      - name: Create fresh SQLite schema
        run: pnpm db:push

      - name: Seed Game Site Engine fixture
        run: pnpm game:seed

      - name: Verify site isolation fixture
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@libsql/client';
          const client = createClient({ url: 'file:data/game-engine-ci.db' });

          const site = await client.execute({
            sql: 'SELECT id, key FROM game_site WHERE key = ?',
            args: ['local-dev'],
          });
          if (site.rows.length !== 1) throw new Error('Expected one local-dev site');

          const games = await client.execute({
            sql: `SELECT sg.id
                  FROM site_game sg
                  JOIN game_site s ON s.id = sg.site_id
                  JOIN site_game_locale l ON l.site_game_id = sg.id
                  WHERE s.key = ? AND l.locale = ? AND l.slug = ?
                    AND sg.status = 'published' AND l.status = 'published'`,
            args: ['local-dev', 'en', 'demo-game'],
          });
          if (games.rows.length !== 1) {
            throw new Error('Expected one published site-scoped demo game');
          }

          const categories = await client.execute({
            sql: `SELECT sc.id
                  FROM site_category sc
                  JOIN game_site s ON s.id = sc.site_id
                  JOIN site_category_locale l ON l.site_category_id = sc.id
                  WHERE s.key = ? AND l.locale = ? AND l.slug = ?
                    AND sc.status = 'published' AND l.status = 'published'`,
            args: ['local-dev', 'en', 'demo-games'],
          });
          if (categories.rows.length !== 1) {
            throw new Error('Expected one published site-scoped demo category');
          }

          await client.close();
          console.log('Game Site Engine SQLite smoke test passed');
          NODE

      - name: Verify cross-site service isolation
        run: pnpm exec tsx scripts/smoke-site-isolation.ts

      - name: Verify public settings validation
        run: pnpm exec tsx scripts/smoke-site-settings.ts

      - name: Verify D1 RBAC bootstrap SQL generation
        run: |
          pnpm game:rbac:bootstrap-d1 -- \
            --admin-email=admin@example.com \
            --out=data/rbac.smoke.sql
          grep -q "INSERT INTO permission" data/rbac.smoke.sql
          grep -q "INSERT INTO role " data/rbac.smoke.sql
          grep -q "INSERT INTO role_permission" data/rbac.smoke.sql
          grep -q "INSERT INTO user_role" data/rbac.smoke.sql
          grep -q "admin@example.com" data/rbac.smoke.sql

      - name: Verify Worker config generation
        run: |
          pnpm exec tsx scripts/configure-game-site-worker.ts \
            --site-key=smoke-site \
            --domain=smoke.example.com \
            --app-url=https://smoke-preview.example.workers.dev \
            --worker=smoke-site \
            --site-name='Smoke Site' \
            --database-id=11111111-1111-4111-8111-111111111111 \
            --database-name=game-site-engine-db \
            --deploy-env=preview \
            --out=data/wrangler.smoke.jsonc

          grep -q '"name": "smoke-site"' data/wrangler.smoke.jsonc
          grep -q '"SITE_KEY": "smoke-site"' data/wrangler.smoke.jsonc
          grep -q '"DEPLOY_ENV": "preview"' data/wrangler.smoke.jsonc
          grep -q '"VITE_APP_URL": "https://smoke-preview.example.workers.dev"' data/wrangler.smoke.jsonc
          grep -q '"database_id": "11111111-1111-4111-8111-111111111111"' data/wrangler.smoke.jsonc
          grep -q '"binding": "DB"' data/wrangler.smoke.jsonc
