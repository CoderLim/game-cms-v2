name: UI Preview Fixture Smoke

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

jobs:
  ui-preview-fixture:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/ui-preview-ci.db
      SITE_KEY: driftbossgame
      DEPLOY_ENV: preview
      VITE_APP_URL: http://localhost:3000
      VITE_APP_NAME: Drift Boss UI Preview
      VITE_DEFAULT_LOCALE: en
      VITE_STATIC_ASSET_ORIGIN: https://static.klotski.org
      AUTH_SECRET: ui-preview-ci-only-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SQLite schemas
        run: pnpm db:setup

      - name: Create fresh SQLite schema
        run: pnpm db:push

      - name: Import real DriftBoss preview fixture
        run: pnpm game:seed:ui-preview

      - name: Verify migrated preview data
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@libsql/client';
          const client = createClient({ url: 'file:data/ui-preview-ci.db' });

          async function value(sql, args = []) {
            const result = await client.execute({ sql, args });
            return Number(result.rows[0]?.value ?? 0);
          }

          const site = await client.execute({
            sql: "SELECT id, key, domain FROM game_site WHERE key = 'driftbossgame'",
            args: [],
          });
          if (site.rows.length !== 1) throw new Error('Expected driftbossgame site');
          const siteId = String(site.rows[0].id);

          const storedImage = await client.execute({
            sql: `SELECT g.image_url
                    FROM site_game sg
                    JOIN game_catalog g ON g.id = sg.game_id
                    WHERE sg.site_id = ? AND g.key = 'drift-boss'`,
            args: [siteId],
          });
          const imageUrl = String(storedImage.rows[0]?.image_url || '');
          if (!imageUrl.startsWith('/games/')) {
            throw new Error(`Expected relative /games asset path, got ${imageUrl}`);
          }
          if (imageUrl.includes('static.driftbossgame.org')) {
            throw new Error('Legacy static domain must not be stored in V2 data');
          }

          const klotskiEmbed = await client.execute({
            sql: `SELECT g.embed_url
                    FROM site_game sg
                    JOIN game_catalog g ON g.id = sg.game_id
                    WHERE sg.site_id = ? AND g.key = 'klotski'`,
            args: [siteId],
          });
          const embedUrl = String(klotskiEmbed.rows[0]?.embed_url || '');
          if (!embedUrl.startsWith('/game-play/')) {
            throw new Error(`Expected relative /game-play asset path, got ${embedUrl}`);
          }

          const legacyAssetRefs = await value(
            `SELECT (
               SELECT COUNT(*) FROM game_catalog
               WHERE COALESCE(image_url, '') LIKE '%static.driftbossgame.org%'
                  OR COALESCE(embed_url, '') LIKE '%static.driftbossgame.org%'
             ) + (
               SELECT COUNT(*) FROM site_game_locale
               WHERE COALESCE(content, '') LIKE '%static.driftbossgame.org%'
             ) + (
               SELECT COUNT(*) FROM site_locale
               WHERE COALESCE(content, '') LIKE '%static.driftbossgame.org%'
             ) + (
               SELECT COUNT(*) FROM site_post_locale
               WHERE COALESCE(image_url, '') LIKE '%static.driftbossgame.org%'
                  OR COALESCE(content, '') LIKE '%static.driftbossgame.org%'
             ) AS value`
          );
          if (legacyAssetRefs !== 0) {
            throw new Error(
              `Expected zero legacy static asset references, got ${legacyAssetRefs}`
            );
          }

          const gameCount = await value(
            'SELECT COUNT(*) AS value FROM site_game WHERE site_id = ?',
            [siteId]
          );
          if (gameCount !== 24) throw new Error(`Expected 24 site games, got ${gameCount}`);

          const categoryCount = await value(
            'SELECT COUNT(*) AS value FROM site_category WHERE site_id = ?',
            [siteId]
          );
          if (categoryCount !== 15) throw new Error(`Expected 15 canonical site categories, got ${categoryCount}`);
          const categoryImageCount = await value(
            "SELECT COUNT(*) AS value FROM site_category WHERE site_id = ? AND image_url IS NOT NULL AND TRIM(image_url) <> ''",
            [siteId]
          );
          if (categoryImageCount !== categoryCount) {
            throw new Error(
              `Expected every canonical preview category to keep an image, got ${categoryImageCount}/${categoryCount}`
            );
          }

          const categoryImages = await client.execute({
            sql: `SELECT gc.key, sc.image_url
                    FROM site_category sc
                    JOIN game_category gc ON gc.id = sc.category_id
                    WHERE sc.site_id = ? AND gc.key IN ('driving-racing-games', 'io-games')
                    ORDER BY gc.key`,
            args: [siteId],
          });
          const imagesByKey = new Map(
            categoryImages.rows.map((row) => [
              String(row.key),
              String(row.image_url || ''),
            ])
          );
          if (imagesByKey.get('driving-racing-games') !== '/cat/racing-games.png') {
            throw new Error(
              `Expected driving-racing-games to reuse the racing image, got ${imagesByKey.get('driving-racing-games')}`
            );
          }
          if (imagesByKey.get('io-games') !== '/cat/io-games.jpg') {
            throw new Error(
              `Expected io-games /cat image, got ${imagesByKey.get('io-games')}`
            );
          }

          const legacyTopLevelCount = await value(
            `SELECT COUNT(*) AS value
               FROM site_category sc
               JOIN game_category gc ON gc.id = sc.category_id
               WHERE sc.site_id = ?
                 AND gc.key IN (
                   '3d-games',
                   'boys-games',
                   'stickman-games',
                   'car-games',
                   'racing-games',
                   'clicker-games',
                   'girls-games',
                   'hypercasual-games',
                   'kids-games',
                   'mahjong-games',
                   'soccer-games'
                 )`,
            [siteId]
          );
          if (legacyTopLevelCount !== 0) {
            throw new Error(
              `Expected no legacy top-level preview categories, got ${legacyTopLevelCount}`
            );
          }


          const featured = await client.execute({
            sql: `SELECT g.key
                    FROM site_game sg
                    JOIN game_catalog g ON g.id = sg.game_id
                    WHERE sg.site_id = ? AND sg.featured = 1`,
            args: [siteId],
          });
          if (featured.rows.length !== 1 || featured.rows[0].key !== 'drift-boss') {
            throw new Error('Drift Boss must be the single featured game');
          }

          const hotCount = await value(
            'SELECT COUNT(*) AS value FROM site_game WHERE site_id = ? AND hot = 1',
            [siteId]
          );
          if (hotCount !== 8) throw new Error(`Expected 8 hot games, got ${hotCount}`);

          const drift = await client.execute({
            sql: `SELECT sg.id
                    FROM site_game sg
                    JOIN game_catalog g ON g.id = sg.game_id
                    WHERE sg.site_id = ? AND g.key = 'drift-boss'`,
            args: [siteId],
          });
          if (drift.rows.length !== 1) throw new Error('Missing Drift Boss site game');
          const driftId = String(drift.rows[0].id);

          const driftLocales = await value(
            'SELECT COUNT(*) AS value FROM site_game_locale WHERE site_game_id = ?',
            [driftId]
          );
          if (driftLocales !== 2) {
            throw new Error(`Expected Drift Boss en+zh locales, got ${driftLocales}`);
          }

          const driftCategories = await value(
            'SELECT COUNT(*) AS value FROM site_game_category WHERE site_game_id = ?',
            [driftId]
          );
          if (driftCategories < 1) {
            throw new Error('Drift Boss must keep at least one canonical category');
          }

          const homepage = await value(
            "SELECT COUNT(*) AS value FROM site_locale WHERE site_id = ? AND locale = 'en' AND status = 'published'",
            [siteId]
          );
          if (homepage !== 1) throw new Error('Missing published homepage locale');

          await client.close();
          console.log('UI preview fixture smoke passed');
          NODE

      - name: Production build with preview fixture schema
        run: pnpm build
